<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhineX Dashboard</title>
<!-- Set this to the deployed backend URL when this page is hosted on GitHub Pages. -->
<meta name="phinex-api-url" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--bg2:#0d0f18;--bg3:#131620;--card:#0f1119;--border:#1c1f2e;--border2:#2a2e47;--accent:#2de08a;--accent2:#1aab67;--dim:rgba(45,224,138,.08);--glow:rgba(45,224,138,.18);--text:#e4e7f0;--text2:#8b90a8;--text3:#5a5f78;--red:#f04747;--gold:#faa61a;--blue:#5865f2;--sb:248px;--hh:60px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(45,224,138,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(45,224,138,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Syne',sans-serif;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:.85em;color:var(--accent)}
[hidden]{display:none!important}

/* header */
.header{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:200;background:rgba(7,8,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo-i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#000;font-size:16px;box-shadow:0 0 16px var(--glow)}
.logo-t{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px}.logo-t span{color:var(--accent)}
.grow{flex:1}
.chip{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;max-width:230px}
.chip:hover{border-color:var(--border2)}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.plain{cursor:default;padding-left:5px}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#000;display:grid;place-items:center;font-size:11px;font-weight:700;object-fit:cover;flex-shrink:0;overflow:hidden}
.av.sq{border-radius:7px}.av.lg{width:44px;height:44px;font-size:15px}.av.xl{width:64px;height:64px;font-size:20px;border-radius:14px}
.hamb{display:none;background:none;border:0;color:var(--text2);font-size:18px;cursor:pointer;padding:6px}

/* screens */
.screen{display:none;position:relative;z-index:1}.screen.on{display:block}
#s-login{min-height:100vh;place-items:center;text-align:center;padding:30px}#s-login.on{display:grid}
.hero-logo{width:72px;height:72px;margin:0 auto 22px;border-radius:18px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:32px;color:#000;box-shadow:0 0 40px var(--glow)}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-1px;margin-bottom:10px}.hero p{color:var(--text2);max-width:420px;margin:0 auto 26px}
#s-servers{padding:calc(var(--hh) + 34px) 32px 50px;max-width:1200px;margin:0 auto}
.top-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top-row h1{font-size:30px;font-weight:800;letter-spacing:-.6px}.top-row p{color:var(--text2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sv{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;text-align:left;width:100%}
.sv:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.sv.has::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.sv .av{margin-bottom:14px}.sv-name{font-weight:700;font-size:15px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-act{margin-top:14px;font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}.sv:not(.has) .sv-act{color:#8c96ff}

/* layout */
.layout{display:flex;padding-top:var(--hh);min-height:100vh}
.sidebar{position:fixed;top:var(--hh);left:0;bottom:0;width:var(--sb);background:var(--bg2);border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;z-index:100;transition:transform .25s}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-l{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);padding:0 9px;margin:16px 0 6px}.nav-l:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text2);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:.15s;margin-bottom:1px}
.nav:hover{background:var(--bg3);color:var(--text)}.nav.on{background:var(--dim);color:var(--accent);border-color:rgba(45,224,138,.14)}.nav i{width:16px;text-align:center;font-size:13px}
.main{margin-left:var(--sb);flex:1;padding:30px 34px 60px;min-width:0;max-width:1100px;position:relative;z-index:1}
.ph{margin-bottom:24px}.ph h1{font-size:26px;font-weight:800;letter-spacing:-.5px}.ph p{color:var(--text2);font-size:14px;margin-top:3px}
.panel-in{animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards & forms */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.card>h3{font-size:15px;margin-bottom:3px}.card>.sub{font-size:13px;color:var(--text2);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}.stat small{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat b{font-family:'Syne',sans-serif;font-size:26px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}.field>label,.lbl{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
.hint{font-size:12px;color:var(--text3)}
.input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}select.input option{background:var(--bg3)}textarea.input{resize:vertical;min-height:88px;line-height:1.5}
input[type=color].input{padding:3px 5px;height:40px;cursor:pointer}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--accent);color:#000}.btn.primary:hover{background:#3df598;transform:translateY(-1px);box-shadow:0 4px 16px var(--glow)}
.btn.ghost{background:var(--bg3);border-color:var(--border);color:var(--text2)}.btn.ghost:hover{border-color:var(--border2);color:var(--text)}
.btn.danger{background:rgba(240,71,71,.1);color:var(--red);border-color:rgba(240,71,71,.22)}.btn.danger:hover{background:rgba(240,71,71,.2)}
.btn.warn{background:rgba(250,166,26,.1);color:var(--gold);border-color:rgba(250,166,26,.22)}.btn.warn:hover{background:rgba(250,166,26,.2)}
.btn.discord{background:var(--blue);color:#fff;padding:13px 22px;font-size:14.5px;width:100%}.btn.discord:hover{background:#4752c4}
.btn.sm{padding:6px 11px;font-size:12px}.btn:disabled,.btn.busy{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.busy::after{content:'';width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}.toggle-row:last-of-type{border-bottom:0}
.t-title{font-weight:600;font-size:14px}.t-desc{font-size:12px;color:var(--text3);margin-top:1px}
.switch{position:relative;width:40px;height:22px;flex-shrink:0}.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:1;margin:0}
.switch i{position:absolute;inset:0;background:var(--border2);border-radius:11px;transition:.2s}.switch i::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i::after{transform:translateX(18px)}
.checklist{background:var(--bg3);border:1px solid var(--border);border-radius:8px}.checklist summary{padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--text2)}
.cl-body{max-height:180px;overflow:auto;padding:4px 12px 10px;display:grid;gap:2px;border-top:1px solid var(--border)}.cl-body label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--text2);cursor:pointer}.tab.on{color:var(--accent);border-color:var(--accent)}

/* tables / lists */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);white-space:nowrap}
td{padding:11px 14px;font-size:13px;color:var(--text2);border-top:1px solid var(--border);vertical-align:middle}.td-m{color:var(--text);font-weight:600}
.who{display:flex;align-items:center;gap:9px;min-width:0}.who small{display:block;color:var(--text3);font-size:11px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.b-green{background:var(--dim);color:var(--accent);border-color:rgba(45,224,138,.2)}.b-red{background:rgba(240,71,71,.1);color:var(--red);border-color:rgba(240,71,71,.22)}.b-gold{background:rgba(250,166,26,.1);color:var(--gold);border-color:rgba(250,166,26,.22)}.b-blue{background:rgba(88,101,242,.12);color:#8c96ff;border-color:rgba(88,101,242,.25)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;margin-bottom:8px}.row .nm{flex:1;min-width:0;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--text3);font-size:12px}
.dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.mres{display:grid;gap:8px;margin-top:14px}.mres .row{cursor:pointer;margin:0}.mres .row:hover{border-color:var(--accent)}
.empty{text-align:center;padding:38px 16px;color:var(--text3);font-size:14px}.empty i{display:block;font-size:30px;margin-bottom:10px;color:var(--border2)}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;border:1px solid var(--border);background:var(--bg3);color:var(--text2)}.note i{margin-top:2px}
.note.warn{background:rgba(250,166,26,.07);border-color:rgba(250,166,26,.25);color:#e9bf72}.note.warn i{color:var(--gold)}
.note.ok{background:var(--dim);border-color:rgba(45,224,138,.2);color:#8fe9bd}.note.ok i{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.rchip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--border)}
.mhead{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.mhead h3{font-size:20px}
.embed{display:flex;border-radius:6px;background:#2b2d31;max-width:480px;overflow:hidden}.embed-bar{width:4px;flex-shrink:0}.embed-b{padding:10px 14px 12px;min-width:0}
.embed-t{font-weight:700;font-size:15px;color:#fff;margin-bottom:4px;word-break:break-word}.embed-d{font-size:14px;color:#dbdee1;white-space:pre-wrap;word-break:break-word}.embed-f{font-size:12px;color:#949ba4;margin-top:8px}.embed img{max-width:100%;border-radius:4px;margin-top:8px;display:block}
.rew{display:grid;grid-template-columns:110px 1fr auto;gap:10px;margin-bottom:8px}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:20px}#modal.open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}
.modal-card{position:relative;background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:34px 30px;width:100%;max-width:430px;box-shadow:0 30px 90px rgba(0,0,0,.6);text-align:center;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-card h2{font-size:22px;font-weight:800;margin:14px 0 8px}.modal-card p{color:var(--text2);font-size:14px;margin-bottom:20px}.modal-card .sm-txt{font-size:12px;color:var(--text3);margin:16px 0 0}
.m-ico{width:58px;height:58px;border-radius:16px;margin:0 auto;display:grid;place-items:center;font-size:24px;background:var(--dim);color:var(--accent)}.m-ico.blue{background:rgba(88,101,242,.15);color:#8c96ff}.m-ico.red{background:rgba(240,71,71,.12);color:var(--red)}
.spinner{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}
.steps{text-align:left;margin:0 0 20px;padding:0;list-style:none}.steps li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13.5px;color:var(--text3)}.steps li.done{color:var(--accent)}.steps li.now{color:var(--text)}.steps i{width:18px;text-align:center}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.mbtns .btn{flex:1}
.toast{position:fixed;right:22px;bottom:22px;z-index:1000;max-width:380px;padding:12px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transform:translateY(16px);opacity:0;transition:.25s;pointer-events:none;backdrop-filter:blur(10px)}
.toast.show{transform:none;opacity:1}.toast.success{background:rgba(45,224,138,.15);border:1px solid rgba(45,224,138,.35);color:var(--accent)}.toast.error{background:rgba(240,71,71,.15);border:1px solid rgba(240,71,71,.35);color:#ff8585}.toast.info{background:rgba(88,101,242,.16);border:1px solid rgba(88,101,242,.35);color:#a3abff}
.loading{display:grid;place-items:center;gap:14px;padding:70px 20px;color:var(--text3);font-size:14px}

@media(max-width:900px){.hamb{display:block}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.5)}.main{margin-left:0;padding:22px 16px 50px}.g2,.g3{grid-template-columns:1fr}#s-servers{padding:calc(var(--hh) + 22px) 16px 40px}.hero h1{font-size:30px}.chip.user span{display:none}}
</style>
</head>
<body>

<!-- LOGIN (modal opens over this) -->
<div class="screen hero" id="s-login">
  <div>
    <div class="hero-logo">⚡</div>
    <h1>PhineX Dashboard</h1>
    <p>Log in with Discord to manage your servers. No commands needed.</p>
    <button class="btn primary" data-act="login"><i class="fab fa-discord"></i> Login with Discord</button>
  </div>
</div>

<!-- SERVER PICKER -->
<div class="screen" id="s-servers">
  <header class="header">
    <a class="logo" href="/"><span class="logo-i">⚡</span><span class="logo-t">Phine<span>X</span></span></a>
    <div class="grow"></div>
    <div class="chip plain user" data-user></div>
    <button class="btn ghost sm" data-act="logout"><i class="fas fa-right-from-bracket"></i> Logout</button>
  </header>
  <div class="top-row">
    <div class="grow"><h1>Select a server</h1><p>Servers where you have <b>Manage Server</b>. Pick one without PhineX to add the bot.</p></div>
    <input class="input" id="serverSearch" placeholder="Search servers…" style="max-width:240px">
    <button class="btn ghost" data-act="refresh-guilds"><i class="fas fa-rotate"></i> Refresh</button>
  </div>
  <div class="grid" id="serverGrid"></div>
</div>

<!-- DASHBOARD -->
<div class="screen" id="s-dash">
  <header class="header">
    <button class="hamb" data-act="toggle-nav" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <a class="logo" href="/"><span class="logo-i">⚡</span><span class="logo-t">Phine<span>X</span></span></a>
    <button class="chip" data-act="to-servers" id="srvChip" title="Switch server"></button>
    <div class="grow"></div>
    <div class="chip plain user" data-user></div>
    <button class="btn ghost sm" data-act="logout"><i class="fas fa-right-from-bracket"></i></button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="content"></main>
  </div>
</div>

<div id="modal" role="presentation"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'phinex_token';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
const API_BASE = (window.PHINEX_API_URL || $('meta[name="phinex-api-url"]')?.content || store.get('phinex_api_url') || 'https://phinex-bot.onrender.com').replace(/\/$/, '');
const API_ORIGIN = (() => { try { return new URL(API_BASE || location.origin, location.href).origin; } catch { return location.origin; } })();
const apiUrl = path => API_BASE + path;
let token = null, me = null, guilds = [], gid = null, G = null, current = 'overview', pendingAdded = null, loginMsg = '';
let popup = null, watch = null, poll = null, renderSeq = 0;

/* ───────────────────────── helpers ───────────────────────── */
function toast(msg, type = 'info') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 4200);
}
function busy(btn, on) { if (!btn) return; btn.disabled = on; btn.classList.toggle('busy', on); }
const timeAgo = ts => { const s = Math.max(1, Math.round((Date.now() - new Date(ts)) / 1000)); const u = [[86400, 'd'], [3600, 'h'], [60, 'm']]; for (const [n, l] of u) if (s >= n) return Math.floor(s / n) + l + ' ago'; return s + 's ago'; };
const dt = ts => new Date(ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const initials = n => esc(String(n || '?').replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2).toUpperCase() || '?');
const avatar = (url, name, cls = '') => url ? `<img class="av ${cls}" src="${esc(url)}" alt="" loading="lazy">` : `<span class="av ${cls}">${initials(name)}</span>`;
const guildIcon = (g, cls = 'sq lg') => g.icon ? avatar(`https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith('a_') ? 'gif' : 'png'}?size=128`, g.name, cls) : `<span class="av ${cls}">${initials(g.name)}</span>`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(apiUrl(path), { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch { throw new Error('Cannot reach the server. If it was asleep, wait ~30 seconds and try again.'); }
  let data = {}; try { data = await res.json(); } catch {}
  if (res.status === 401 && data.code === 'session_expired') { expireSession(data.error); throw new Error(data.error || 'Session expired'); }
  if (!res.ok) { const e = new Error(data.error || `Request failed (${res.status})`); e.code = data.code; e.status = res.status; throw e; }
  return data;
}

/* ───────────────────────── modal system ───────────────────────── */
function modal(html, { dismiss = true } = {}) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-bg" ${dismiss ? 'data-act="close-modal"' : ''}></div><div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.add('open');
}
function closeModal() { stopWatch(); $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; }
function stopWatch() { clearInterval(watch); clearInterval(poll); watch = poll = null; }
let confirmResolve = null;
function confirmBox({ title, text, confirm = 'Confirm', danger = true, fields = '', read = null }) {
  return new Promise(resolve => {
    confirmResolve = ok => { confirmResolve = null; const v = ok ? (read ? read() : true) : null; closeModal(); resolve(v); };
    modal(`<div class="m-ico ${danger ? 'red' : ''}"><i class="fas fa-${danger ? 'triangle-exclamation' : 'circle-question'}"></i></div><h2>${esc(title)}</h2><p>${text}</p>${fields}
      <div class="mbtns"><button class="btn ghost" data-act="confirm-no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="confirm-yes">${esc(confirm)}</button></div>`, { dismiss: false });
  });
}

/* ───────────────────────── auth: login modal + popup ───────────────────────── */
function setScreen(name) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name)); window.scrollTo(0, 0); }
function openPopup(url, name) {
  const w = 500, h = 740, l = Math.max(0, (screen.width - w) / 2), t = Math.max(0, (screen.height - h) / 2);
  return window.open(url, name, `width=${w},height=${h},left=${l},top=${t},popup=yes`);
}

function showLogin(state = 'idle', msg = '') {
  setScreen('login');
  if (state === 'waiting') {
    modal(`<div class="spinner"></div><h2>Waiting for Discord…</h2><p>A Discord window opened. Log in and click <b>Authorize</b> there. This window continues automatically.</p>
      <div class="mbtns"><button class="btn ghost" data-act="login">Reopen window</button><button class="btn ghost" data-act="cancel-login">Cancel</button></div>`, { dismiss: false });
  } else {
    modal(`<div class="m-ico blue"><i class="fab fa-discord"></i></div><h2>Login with Discord</h2>
      <p>${msg ? `<span style="color:#ff8585">${esc(msg)}</span><br><br>` : ''}Sign in to choose a server to manage. We only read your username and the list of servers you manage.</p>
      <button class="btn discord" data-act="login"><i class="fab fa-discord"></i> Continue with Discord</button><div class="sm-txt">A small Discord window will open. It closes itself when you're done.</div>`, { dismiss: false });
  }
}
async function startLogin() {
  popup = openPopup(apiUrl('/auth/login'), 'phinex_login');
  if (!popup) { location.href = apiUrl('/auth/login'); return; }
  showLogin('waiting');
  clearInterval(watch);
  watch = setInterval(() => { if (popup && popup.closed) { clearInterval(watch); if (!token) showLogin('idle', 'The login window was closed before finishing.'); } }, 700);
}
function expireSession(msg) { store.del(KEY); token = null; me = null; closeModal(); showLogin('idle', msg || 'Your session expired. Please log in again.'); }
function logout() { store.del(KEY); token = null; me = null; guilds = []; G = null; closeModal(); showLogin('idle'); }

window.addEventListener('message', e => {
  if ((e.origin !== location.origin && e.origin !== API_ORIGIN) || !e.data || typeof e.data !== 'object') return;
  const d = e.data;
  if (d.type === 'phinex-auth' && d.token) { stopWatch(); token = d.token; store.set(KEY, token); closeModal(); bootstrap(); }
  else if (d.type === 'phinex-auth-error') { stopWatch(); showLogin('idle', d.error); }
  else if (d.type === 'phinex-bot-added') { if (inviteCtx) { inviteCtx.authorized = true; renderInvite(); } }
  else if (d.type === 'phinex-bot-error') { if (inviteCtx) { stopWatch(); renderInvite('cancelled'); } }
});

function userChips() {
  $$('[data-user]').forEach(el => { el.innerHTML = me ? `${avatar(me.avatar ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=64` : '', me.username)}<span>${esc(me.name || me.username)}</span>` : ''; });
}

/* ───────────────────────── server picker + add-bot flow ───────────────────────── */
function renderServers() {
  const q = ($('#serverSearch').value || '').toLowerCase();
  const list = guilds.filter(g => g.name.toLowerCase().includes(q));
  $('#serverGrid').innerHTML = list.length ? list.map(g => `
    <button class="sv ${g.hasBot ? 'has' : ''}" data-act="pick-server" data-id="${esc(g.id)}">
      ${guildIcon(g)}<div class="sv-name">${esc(g.name)}</div>
      ${g.hasBot ? '<span class="badge b-green">● Bot active</span>' : '<span class="badge">Bot not added</span>'}
      <div class="sv-act">${g.hasBot ? '<i class="fas fa-sliders"></i> Manage server' : '<i class="fab fa-discord"></i> Add PhineX'}</div>
    </button>`).join('')
    : `<div class="empty" style="grid-column:1/-1"><i class="fas fa-server"></i>${guilds.length ? 'No servers match your search.' : 'No servers found where you have the Manage Server permission.'}</div>`;
}
function showServers() { stopWatch(); closeModal(); gid = null; G = null; setScreen('servers'); userChips(); renderServers(); }

let inviteCtx = null;
function startInvite(g) {
  inviteCtx = { g, authorized: false, startedAt: Date.now(), timedOut: false };
  popup = openPopup(apiUrl('/invite?guild=' + encodeURIComponent(g.id)), 'phinex_invite');
  if (!popup) { location.href = apiUrl('/invite?guild=' + encodeURIComponent(g.id)); return; }
  renderInvite();
  clearInterval(poll);
  poll = setInterval(async () => {
    try {
      const s = await api('GET', `/api/guild/${g.id}/status`);
      if (s.hasBot) { stopWatch(); return botJoined(g.id); }
    } catch {}
    const closed = popup && popup.closed;
    if (Date.now() - inviteCtx.startedAt > 120000 || (closed && Date.now() - (inviteCtx.closedAt ||= Date.now()) > 15000)) { stopWatch(); renderInvite('timeout'); }
  }, 1500);
}
function renderInvite(state) {
  const { g, authorized } = inviteCtx;
  if (state === 'cancelled' || state === 'timeout') {
    modal(`<div class="m-ico red"><i class="fas fa-circle-xmark"></i></div><h2>${state === 'cancelled' ? 'Invite cancelled' : "PhineX hasn't joined yet"}</h2>
      <p>${state === 'cancelled' ? 'You closed the Discord authorization. Nothing was changed.' : 'The authorization didn\'t finish. You can try again — make sure you click <b>Authorize</b> on Discord.'}</p>
      <div class="mbtns"><button class="btn ghost" data-act="close-invite">Back</button><button class="btn primary" data-act="retry-invite">Try again</button></div>`, { dismiss: false });
    return;
  }
  const step = (n, label) => `<li class="${authorized ? (n < 3 ? 'done' : 'now') : (n === 1 ? 'now' : '')} ${authorized && n === 3 ? 'now' : ''}"><i class="fas fa-${(authorized && n < 3) ? 'circle-check' : (n === (authorized ? 3 : 1) ? 'circle-notch fa-spin' : 'circle')}"></i>${label}</li>`;
  modal(`${guildIcon(g, 'sq xl').replace('class="av', 'style="margin:0 auto" class="av')}<h2>Add PhineX to ${esc(g.name)}</h2>
    <p>Authorize the bot in the Discord window that just opened. Then you'll land straight in this server's dashboard.</p>
    <ul class="steps">${step(1, 'Authorize PhineX on Discord')}${step(2, 'Bot joins your server')}${step(3, 'Opening dashboard')}</ul>
    <div class="mbtns"><button class="btn ghost" data-act="retry-invite">Reopen window</button><button class="btn ghost" data-act="close-invite">Cancel</button></div>`, { dismiss: false });
}
async function botJoined(id) {
  try { guilds = await api('GET', '/api/guilds?refresh=1'); } catch {}
  inviteCtx = null;
  closeModal(); toast('PhineX joined the server!', 'success');
  openGuild(id);
}
async function waitForBot(id) {       // used after a full-page invite redirect (#added=ID)
  const g = guilds.find(x => x.id === id);
  if (!g) { showServers(); toast('That server is not in your manageable list.', 'error'); return; }
  if (g.hasBot) return openGuild(id);
  setScreen('servers'); userChips(); renderServers();
  inviteCtx = { g, authorized: true, startedAt: Date.now() };
  renderInvite();
  clearInterval(poll);
  poll = setInterval(async () => {
    try { const s = await api('GET', `/api/guild/${id}/status`); if (s.hasBot) { stopWatch(); return botJoined(id); } } catch {}
    if (Date.now() - inviteCtx.startedAt > 60000) { stopWatch(); renderInvite('timeout'); }
  }, 1500);
}

/* ───────────────────────── bootstrap ───────────────────────── */
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('token')) { token = p.get('token'); store.set(KEY, token); }
  if (p.get('added')) pendingAdded = p.get('added');
  if (p.get('error')) loginMsg = p.get('error');
  if (p.has('token') || p.has('added') || p.has('error')) history.replaceState(null, '', location.pathname);
}
async function bootstrap() {
  setScreen('servers'); $('#serverGrid').innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Loading your servers…</div>';
  try {
    me = await api('GET', '/api/me'); userChips();
    guilds = await api('GET', '/api/guilds');
  } catch (e) { if (!token) return; setScreen('servers'); $('#serverGrid').innerHTML = `<div class="empty" style="grid-column:1/-1"><i class="fas fa-plug-circle-xmark"></i>${esc(e.message)}<br><br><button class="btn primary" data-act="retry-boot">Retry</button></div>`; return; }
  if (pendingAdded) { const id = pendingAdded; pendingAdded = null; return waitForBot(id); }
  showServers();
}
async function openGuild(id) {
  const g = guilds.find(x => x.id === id);
  if (g && !g.hasBot) return startInvite(g);
  setScreen('dash'); userChips(); $('#content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading server…</div>'; $('#sidebar').innerHTML = '';
  try {
    G = await api('GET', `/api/guild/${id}`); gid = id;
  } catch (e) {
    if (e.code === 'no_bot' && g) { g.hasBot = false; return startInvite(g); }
    toast(e.message, 'error'); return showServers();
  }
  $('#srvChip').innerHTML = `${guildIcon(G.guild, 'sq')}<span>${esc(G.guild.name)}</span><i class="fas fa-chevron-down" style="font-size:10px;color:var(--text3)"></i>`;
  buildNav(); switchPanel(panels[current] ? current : 'overview');
}

async function memberSearch() {

async function modAct(action, btn) {
  const u = memberView.user; const reason = val('mReason').trim();
  let extra = {};
  if (action === 'kick' || action === 'ban') {
    const r = await confirmBox({ title: `${action === 'ban' ? 'Ban' : 'Kick'} ${u.username}?`, text: action === 'ban' ? 'They will be removed and unable to rejoin until unbanned.' : 'They will be removed but can rejoin with an invite.', confirm: action === 'ban' ? 'Ban member' : 'Kick member',
      fields: action === 'ban' ? '<div class="field" style="text-align:left"><label>Delete their messages from the last…</label><select class="input" id="delDays"><option value="0">Don\'t delete any</option><option value="1">1 day</option><option value="7">7 days</option></select></div>' : '', read: () => ({ days: Number(val('delDays') || 0) }) });
    if (!r) return; extra = { deleteDays: r.days || 0 };
  }
  if (action === 'timeout') extra = { minutes: Number(val('mMin')) };
  busy(btn, true);
  try { const r = await api('POST', `/api/guild/${gid}/mod/${action}`, { userId: u.id, reason, ...extra }); toast(r.message, 'success'); await memberOpen(u.id); }
  catch (e) { toast(e.message, 'error'); busy(btn, false); }
}

function channelsHTML() {
  const row = (c, ind) => `<div class="row" style="margin-left:${ind ? 22 : 0}px"><i class="fas fa-${CH_ICON[c.type] || 'hashtag'}" style="color:var(--text3);width:16px;text-align:center"></i><span class="nm">${esc(c.name)}</span><span class="badge">${c.type}</span><button class="btn danger sm" data-act="ch-del" data-id="${esc(c.id)}"><i class="fas fa-trash"></i></button></div>`;
  const cats = G.channels.filter(c => c.type === 'category'), loose = G.channels.filter(c => c.type !== 'category' && !cats.some(k => k.id === c.parentId));
  return loose.map(c => row(c, 0)).join('') + cats.map(k => row(k, 0) + G.channels.filter(c => c.parentId === k.id && c.type !== 'category').map(c => row(c, 1)).join('')).join('') || empty('hashtag', 'No channels.');
}

/* ── social links ── */
const SOCIAL = [['facebook', 'fab fa-facebook', '#1877f2'], ['instagram', 'fab fa-instagram', '#e1306c'], ['twitter', 'fab fa-x-twitter', '#000'], ['youtube', 'fab fa-youtube', '#f00'], ['linkedin', 'fab fa-linkedin', '#0a66c2'], ['discord', 'fab fa-discord', '#5865f2'], ['whatsapp', 'fab fa-whatsapp', '#25d366'], ['github', 'fab fa-github', '#333'], ['website', 'fas fa-globe', '#2d7d5f']];
panels.social = {
  title: 'Social Links', sub: 'Shown to members with the <code>/social</code> command.',
  async render() {
    const { links } = await api('GET', `/api/guild/${gid}/social`);
    return card('', '', `<div class="g2">${SOCIAL.map(([k, ic, c]) => `<div class="field"><label><i class="${ic}" style="color:${c === '#000' || c === '#333' ? '#aaa' : c};width:18px"></i> ${k}</label><input class="input sc" data-k="${k}" type="url" placeholder="https://…" value="${esc(links[k] || '')}"></div>`).join('')}</div>
      <div class="actions"><button class="btn primary" data-act="save-social"><i class="fas fa-floppy-disk"></i> Save links</button></div>`);
  }
};

/* ───────────────────────── actions (event delegation) ───────────────────────── */
const actions = {
  'login': () => startLogin(),
  'cancel-login': () => { stopWatch(); try { popup && popup.close(); } catch {} showLogin('idle'); },
  'logout': () => logout(),
  'close-modal': () => closeModal(),
  'confirm-yes': () => confirmResolve && confirmResolve(true),
  'confirm-no': () => confirmResolve && confirmResolve(false),
  'retry-boot': () => bootstrap(),
  'toggle-nav': () => $('#sidebar').classList.toggle('open'),
  'to-servers': () => showServers(),
  'nav': el => switchPanel(el.dataset.id),
  'refresh-guilds': async el => { busy(el, true); try { guilds = await api('GET', '/api/guilds?refresh=1'); renderServers(); toast('Server list refreshed.', 'success'); } catch (e) { toast(e.message, 'error'); } busy(el, false); },
  'pick-server': el => { const g = guilds.find(x => x.id === el.dataset.id); g && (g.hasBot ? openGuild(g.id) : startInvite(g)); },
  'retry-invite': () => inviteCtx && startInvite(inviteCtx.g),
  'close-invite': () => { stopWatch(); try { popup && popup.close(); } catch {} inviteCtx = null; closeModal(); },
  'fix-perms': () => { const g = guilds.find(x => x.id === gid) || G.guild; inviteCtx = { g, authorized: false, startedAt: Date.now() }; popup = openPopup(apiUrl('/invite?guild=' + gid), 'phinex_invite'); if (popup) { renderInvite(); poll = setInterval(() => { if (popup.closed) { stopWatch(); closeModal(); openGuild(gid); } }, 1000); } },

  'save-welcome': el => saveSettings({ welcome_channel: val('wCh'), welcome_role: val('wRole'), welcome_message: val('wMsg') }, el, 'Welcome settings saved!'),
  'save-leave': el => saveSettings({ leave_channel: val('lCh'), leave_message: val('lMsg') }, el, 'Leave message saved!'),
  'save-logging': el => saveSettings({ log_channel: val('logCh'), logging: { joins: on('lgJoin'), leaves: on('lgLeave'), messageDeletes: on('lgDel'), messageEdits: on('lgEdit'), moderation: on('lgMod') } }, el, 'Logging saved!'),
  'save-starboard': el => saveSettings({ starboard_channel: val('sbCh'), starboard_emoji: val('sbEmoji') || '⭐', starboard_threshold: Number(val('sbN')) || 3 }, el, 'Starboard saved!'),
  'save-suggest': el => saveSettings({ suggestions_channel: val('sgCh') }, el, 'Suggestions channel saved!'),
  'save-automod': el => saveSettings({ automod: {
    enabled: on('amOn'), blockInvites: on('amInv'), blockLinks: on('amLink'), badWords: val('amWords').split(/[\n,]+/).map(w => w.trim()).filter(Boolean), maxMentions: Number(val('amMen')),
    spam: { enabled: on('amSpam'), messages: Number(val('amSpamN')), seconds: Number(val('amSpamS')) }, action: val('amAct'), timeoutMinutes: Number(val('amTo')),
    ignoredChannels: checked('amIgCh'), ignoredRoles: checked('amIgRo'), warnThreshold: Number(val('amWarnN')), thresholdAction: val('amThA'), thresholdMinutes: Number(val('amThM')) } }, el, 'AutoMod saved!'),
  'save-leveling': el => saveSettings({ leveling: {
    enabled: on('lvOn'), xpMin: Number(val('lvMin')), xpMax: Number(val('lvMax')), cooldown: Number(val('lvCd')), announce: val('lvAnn'), channelId: val('lvCh'), message: val('lvMsg'),
    roleRewards: $$('.rew').map(r => ({ level: Number($('.rw-lv', r).value), roleId: $('.rw-ro', r).value })).filter(r => r.level && r.roleId), ignoredChannels: checked('lvIg') } }, el, 'Leveling saved!'),
  'reward-add': () => $('#rewards').insertAdjacentHTML('beforeend', rewardRow()),
  'reward-del': el => el.closest('.rew').remove(),

  'cc-add': async el => { busy(el, true); try { await api('POST', `/api/guild/${gid}/commands`, { name: val('ccName'), response: val('ccResp') }); toast('Command saved!', 'success'); switchPanel('commands'); } catch (e) { toast(e.message, 'error'); busy(el, false); } },
  'cc-del': async el => { try { await api('DELETE', `/api/guild/${gid}/commands/${encodeURIComponent(el.dataset.id)}`); toast('Command removed.', 'success'); switchPanel('commands'); } catch (e) { toast(e.message, 'error'); } },

  'mtab': el => { $$('.tab').forEach(t => t.classList.toggle('on', t === el)); $('#m-find').hidden = el.dataset.id !== 'find'; $('#m-bans').hidden = el.dataset.id !== 'bans'; if (el.dataset.id === 'bans') loadBans(); },
  'member-search': () => memberSearch(),
  'member-open': el => memberOpen(el.dataset.id),
  'mod': (el) => modAct(el.dataset.id, el),
  'warn-del': async el => { try { await api('DELETE', `/api/guild/${gid}/warning/${el.dataset.id}`); toast('Warning removed.', 'success'); memberOpen(memberView.user.id); } catch (e) { toast(e.message, 'error'); } },
  'warn-clear': async () => { if (!await confirmBox({ title: 'Clear all warnings?', text: 'This removes every warning for this member.', confirm: 'Clear warnings' })) return; try { await api('DELETE', `/api/guild/${gid}/warnings/${memberView.user.id}`); toast('Warnings cleared.', 'success'); memberOpen(memberView.user.id); } catch (e) { toast(e.message, 'error'); } },
  'unban-quick': async el => { try { await api('POST', `/api/guild/${gid}/mod/unban`, { userId: el.dataset.id, reason: 'Unbanned from dashboard' }); toast('Unbanned.', 'success'); loadBans(); } catch (e) { toast(e.message, 'error'); } },
  'logs-load': () => loadLogs(),

  'gw-start': async el => { busy(el, true); try { await api('POST', `/api/guild/${gid}/giveaways`, { channelId: val('gwCh'), prize: val('gwPrize'), winners: Number(val('gwWin')), durationMinutes: Number(val('gwDur')) * Number(val('gwUnit')) }); toast('Giveaway started!', 'success'); switchPanel('giveaways'); } catch (e) { toast(e.message, 'error'); busy(el, false); } },
  'gw-end': async el => { try { await api('POST', `/api/guild/${gid}/giveaways/${el.dataset.id}/end`); toast('Giveaway ended.', 'success'); switchPanel('giveaways'); } catch (e) { toast(e.message, 'error'); } },

  'an-send': async el => { busy(el, true); try { await api('POST', `/api/guild/${gid}/send`, { channelId: val('anCh'), content: val('anMsg'), pingEveryone: on('anPing'), embed: { title: val('anT'), description: val('anD'), color: val('anC'), footer: val('anF'), imageUrl: val('anI') } }); toast('Sent!', 'success'); } catch (e) { toast(e.message, 'error'); } busy(el, false); },
  'tk-post': async el => {
    const support = el.dataset.id === 'support'; busy(el, true);
    try { await api('POST', `/api/guild/${gid}/tickets/panel`, support ? { kind: 'support', channelId: val('tkCh'), roleId: val('tkRole'), title: val('tkT'), description: val('tkD'), buttonLabel: val('tkB') } : { kind: 'community', channelId: val('cmCh'), title: val('cmT'), buttonLabel: val('cmB') }); toast('Panel posted!', 'success'); }
    catch (e) { toast(e.message, 'error'); } busy(el, false);
  },

  'role-add': async el => { busy(el, true); try { const { role } = await api('POST', `/api/guild/${gid}/roles`, { name: val('rlName'), color: val('rlColor'), hoist: on('rlHoist'), mentionable: on('rlMent') }); G.roles.unshift(role); $('#roleList').innerHTML = rolesHTML(); $('#rlName').value = ''; toast(`Role "${role.name}" created.`, 'success'); } catch (e) { toast(e.message, 'error'); } busy(el, false); },
  'role-del': async el => { const r = G.roles.find(x => x.id === el.dataset.id); if (!await confirmBox({ title: `Delete "${r.name}"?`, text: 'Members will lose this role. This cannot be undone.', confirm: 'Delete role' })) return; try { await api('DELETE', `/api/guild/${gid}/roles/${r.id}`); G.roles = G.roles.filter(x => x.id !== r.id); $('#roleList').innerHTML = rolesHTML(); toast('Role deleted.', 'success'); } catch (e) { toast(e.message, 'error'); } },
  'ch-add': async el => { busy(el, true); try { const { channel } = await api('POST', `/api/guild/${gid}/channels`, { name: val('chName'), type: val('chType'), parentId: val('chParent') }); G.channels.push(channel); $('#chList').innerHTML = channelsHTML(); $('#chName').value = ''; toast(`#${channel.name} created.`, 'success'); } catch (e) { toast(e.message, 'error'); } busy(el, false); },
  'ch-del': async el => { const c = G.channels.find(x => x.id === el.dataset.id); if (!await confirmBox({ title: `Delete ${c.name}?`, text: 'All of its messages are permanently lost.', confirm: 'Delete channel' })) return; try { await api('DELETE', `/api/guild/${gid}/channels/${c.id}`); G.channels = G.channels.filter(x => x.id !== c.id); $('#chList').innerHTML = channelsHTML(); toast('Channel deleted.', 'success'); } catch (e) { toast(e.message, 'error'); } },
  'save-social': async el => { busy(el, true); const links = {}; $$('.sc').forEach(i => links[i.dataset.k] = i.value.trim()); try { await api('POST', `/api/guild/${gid}/social`, { links }); toast('Social links saved!', 'success'); } catch (e) { toast(e.message, 'error'); } busy(el, false); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const cl = e.target.closest('.checklist');
  if (cl) cl.querySelector('summary b').textContent = cl.querySelectorAll('input:checked').length;
});
document.addEventListener('input', e => { if (e.target.id === 'serverSearch') renderServers(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal.open .modal-bg[data-act]')) closeModal(); });

/* ───────────────────────── start ───────────────────────── */
readHash();
token = token || store.get(KEY);
async function initAuth() {
  if (token) return bootstrap();
  showLogin('idle', loginMsg);
}
initAuth();
})();
</script>
</body>
